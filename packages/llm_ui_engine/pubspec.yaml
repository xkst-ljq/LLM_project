name: llm_ui_engine
description: "LLM Project 的 UI 引擎：组件模型、联动器、数据通道与运行时渲染。主项目与 PC 转译工具共用同一份源码。"
publish_to: 'none'
version: 0.1.0

environment:
  # **必须与主项目一致，不要图省事写宽松区间。**
  #
  # SDK 约束不只影响依赖求解，它还决定**语言版本**。
  #
  # 教训：抽包时这里误写成 ^3.5.0，语言版本被压到 3.5。
  # `ui_renderer.dart` 里原有的 `errorBuilder: (_, _, _) => ...`
  # 用的是 Dart 3.7 的 wildcard 变量，在主项目（^3.11.5）下一直合法，
  # 迁进包后却报 `duplicate_definition: '_'`——
  # **源码一个字没改，是约束把语言版本降级了**。
  #
  # 那批回调后来已改写成 `(_, __, ___)`（低版本也能过），
  # 但约束本身仍须对齐，否则下次再用到新语法还会踩同一个坑。
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # 富文本渲染（text / message_flow 的 Markdown 与 HTML）
  flutter_markdown: ^0.7.1
  markdown: ^7.3.1
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 水波折射着色器。
  #
  # 作为 package 资源声明后，运行时路径变为
  # `packages/llm_ui_engine/shaders/ripple_refraction.frag`
  # ——见 ripple_shader.dart 里的加载逻辑。
  shaders:
    - shaders/ripple_refraction.frag
