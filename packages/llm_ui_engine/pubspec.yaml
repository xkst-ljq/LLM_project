name: llm_ui_engine
description: "LLM Project 的 UI 引擎：组件模型、联动器、数据通道与运行时渲染。主项目与 PC 转译工具共用同一份源码。"
publish_to: 'none'
version: 0.1.0

environment:
  # **必须 >= 3.7，且与主项目保持一致。**
  #
  # SDK 约束不只影响依赖求解，它还决定**语言版本**。
  # `ui_renderer.dart` 用了 Dart 3.7 的 wildcard 变量
  # （`errorBuilder: (_, _, _) => ...` 这类同名占位参数）。
  #
  # 这段代码在主项目里一直没问题（那边是 ^3.11.5），
  # 但抽包时我误写成 ^3.5.0，语言版本被压到 3.5，
  # wildcard 特性不可用，于是同一处代码突然报
  # `duplicate_definition: '_'`——**代码没变，是约束变了**。
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # 富文本渲染（text / message_flow 的 Markdown 与 HTML）
  flutter_markdown: ^0.7.1
  markdown: ^7.3.1
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 水波折射着色器。
  #
  # 作为 package 资源声明后，运行时路径变为
  # `packages/llm_ui_engine/shaders/ripple_refraction.frag`
  # ——见 ripple_shader.dart 里的加载逻辑。
  shaders:
    - shaders/ripple_refraction.frag
