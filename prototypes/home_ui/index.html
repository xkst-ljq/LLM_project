<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LLM Project · Mobile Home Concept</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #080b11;
        --surface: rgba(20, 25, 35, 0.78);
        --surface-solid: #121720;
        --surface-soft: rgba(255, 255, 255, 0.08);
        --surface-pressed: rgba(255, 255, 255, 0.14);
        --text: #f4f5f8;
        --muted: #a6adba;
        --quiet: #788293;
        --line: rgba(255, 255, 255, 0.16);
        --line-strong: rgba(255, 255, 255, 0.28);
        --accent: #a8b0ff;
        --accent-deep: #6574e5;
        --accent-soft: rgba(168, 176, 255, 0.18);
        --accent-glow: rgba(118, 133, 255, 0.4);
        --success: #83d7b0;
        --danger: #ff9290;
        --shadow: 0 25px 70px rgba(0, 0, 0, 0.42);
        --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
      }

      [data-theme="day"] {
        color-scheme: light;
        --canvas: #e9e7e0;
        --surface: rgba(255, 255, 255, 0.84);
        --surface-solid: #fbfaf7;
        --surface-soft: rgba(25, 30, 40, 0.07);
        --surface-pressed: rgba(25, 30, 40, 0.12);
        --text: #191b20;
        --muted: #6b717b;
        --quiet: #8d939d;
        --line: rgba(25, 30, 40, 0.14);
        --line-strong: rgba(25, 30, 40, 0.24);
        --accent: #5364d9;
        --accent-deep: #3f4fb8;
        --accent-soft: rgba(83, 100, 217, 0.13);
        --accent-glow: rgba(83, 100, 217, 0.22);
        --shadow: 0 25px 70px rgba(39, 40, 46, 0.18);
      }

      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; }
      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 0%, rgba(117, 130, 240, 0.15), transparent 30rem),
          var(--canvas);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
        transition: background-color 260ms var(--ease), color 260ms var(--ease);
      }

      button { font: inherit; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

      .mobile-preview {
        position: relative;
        width: min(100vw, 430px);
        height: min(900px, 100svh);
        min-height: 680px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 38px;
        background: var(--canvas);
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.35);
      }

      @media (max-width: 520px) {
        body { display: block; overflow: hidden; }
        .mobile-preview { width: 100vw; height: 100svh; min-height: 100svh; border: 0; border-radius: 0; box-shadow: none; }
      }

      .home {
        position: relative;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        background: #0a0d14;
      }

      .home::before {
        content: "";
        position: absolute;
        z-index: -3;
        inset: 0;
        background:
          radial-gradient(circle at 62% 26%, rgba(184, 194, 255, 0.62), transparent 14rem),
          linear-gradient(180deg, rgba(5, 8, 13, 0.04) 0%, rgba(5, 8, 13, 0.1) 38%, rgba(5, 8, 13, 0.94) 81%, #080a0f 100%),
          linear-gradient(145deg, #182234, #51649e 50%, #0c121c);
        transition: background 360ms var(--ease);
      }
      .home[data-role="lume"]::before {
        background:
          radial-gradient(circle at 68% 25%, rgba(255, 214, 175, 0.64), transparent 14rem),
          linear-gradient(180deg, rgba(18, 5, 10, 0.03) 0%, rgba(18, 5, 10, 0.1) 38%, rgba(11, 5, 10, 0.94) 81%, #0a080d 100%),
          linear-gradient(145deg, #4d2a36, #b97868 50%, #181019);
      }
      .home[data-role="riven"]::before {
        background:
          radial-gradient(circle at 30% 27%, rgba(130, 226, 205, 0.56), transparent 14rem),
          linear-gradient(180deg, rgba(2, 16, 19, 0.03) 0%, rgba(2, 16, 19, 0.1) 38%, rgba(3, 11, 14, 0.94) 81%, #050b0e 100%),
          linear-gradient(145deg, #0d3036, #287876 50%, #071318);
      }
      .home[data-role="null"]::before {
        background:
          radial-gradient(circle at 50% 25%, rgba(210, 215, 230, 0.42), transparent 14rem),
          linear-gradient(180deg, rgba(12, 14, 20, 0.03) 0%, rgba(8, 10, 15, 0.12) 38%, rgba(6, 8, 12, 0.94) 81%, #07090e 100%),
          linear-gradient(145deg, #272d3a, #5c6578 50%, #131720);
      }

      .home::after {
        content: "";
        position: absolute;
        z-index: -2;
        right: -11%;
        top: 11%;
        width: 79%;
        height: 61%;
        border-radius: 52% 48% 18% 18%;
        background: linear-gradient(160deg, rgba(232, 236, 255, 0.8), rgba(116, 132, 220, 0.2) 45%, rgba(5, 8, 14, 0.74));
        transform: rotate(-7deg);
        box-shadow: -25px 28px 120px var(--accent-glow);
        opacity: 0.74;
        transition: background 360ms var(--ease), box-shadow 360ms var(--ease);
      }

      .home[data-role="lume"]::after { background: linear-gradient(160deg, rgba(255, 231, 202, 0.78), rgba(191, 114, 103, 0.25) 45%, rgba(10, 5, 11, 0.74)); }
      .home[data-role="riven"]::after { background: linear-gradient(160deg, rgba(207, 255, 240, 0.72), rgba(58, 157, 148, 0.23) 45%, rgba(3, 10, 13, 0.78)); }

      .grain {
        position: absolute;
        z-index: -1;
        inset: 0;
        opacity: 0.15;
        background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.07) 0 1px, transparent 1px 4px);
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      .safe-top { padding-top: max(16px, env(safe-area-inset-top)); }
      .safe-bottom { padding-bottom: max(14px, env(safe-area-inset-bottom)); }

      .mobile-header {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 18px 0;
      }
      .session-chip {
        display: flex;
        align-items: center;
        gap: 9px;
        max-width: 220px;
        padding: 7px 11px 7px 7px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        background: rgba(5,8,14,0.18);
        color: rgba(244,246,255,0.74);
        backdrop-filter: blur(14px);
        font-size: 10px;
        font-weight: 760;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      .session-avatar { display: grid; place-items: center; width: 25px; height: 25px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 13px; }
      .header-actions { display: flex; gap: 7px; }
      .round-button {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 50%;
        background: rgba(5,8,14,0.18);
        color: rgba(244,246,255,0.82);
        cursor: pointer;
        backdrop-filter: blur(14px);
        transition: transform 180ms var(--ease), background-color 180ms var(--ease), border-color 180ms var(--ease);
      }
      .round-button:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.4); }
      .round-button:active { transform: scale(0.92); }

      .scene-area {
        position: absolute;
        z-index: 1;
        top: 96px;
        right: 0;
        left: 0;
        bottom: 290px;
        display: flex;
        align-items: end;
        justify-content: center;
        padding: 0 22px;
        pointer-events: none;
      }
      .scene-mark {
        display: grid;
        place-items: center;
        width: 92px;
        height: 92px;
        margin-bottom: 142px;
        border: 1px solid rgba(255,255,255,0.36);
        border-radius: 31px;
        background: rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.92);
        box-shadow: 0 0 38px var(--accent-glow);
        backdrop-filter: blur(15px);
        font-size: 44px;
        transform: rotate(-4deg);
        animation: gentle-float 6s ease-in-out infinite;
      }
      @keyframes gentle-float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(-2deg); } }

      .identity {
        position: absolute;
        z-index: 2;
        right: 22px;
        bottom: 244px;
        left: 22px;
        text-align: center;
        color: white;
      }
      .identity-kicker { color: rgba(244,246,255,0.58); font-size: 10px; font-weight: 800; letter-spacing: 0.2em; }
      .identity h1 { margin: 10px 0 0; font-size: clamp(48px, 16vw, 70px); line-height: 0.82; letter-spacing: -0.09em; text-shadow: 0 10px 30px rgba(0,0,0,0.38); }
      .identity p { margin: 13px auto 0; max-width: 270px; color: rgba(244,246,255,0.72); font-size: 12px; line-height: 1.5; }

      .bottom-console {
        position: absolute;
        z-index: 3;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 24px 18px 15px;
        background: linear-gradient(180deg, transparent 0%, rgba(6,8,13,0.64) 16%, rgba(6,8,13,0.97) 43%);
      }
      .console-handle { width: 34px; height: 3px; margin: 0 auto 16px; border-radius: 99px; background: rgba(255,255,255,0.36); }
      .continue-meta { display: flex; align-items: center; justify-content: space-between; color: rgba(244,246,255,0.58); font-size: 10px; }
      .continue-meta span:first-child { display: inline-flex; align-items: center; gap: 7px; color: rgba(244,246,255,0.8); font-weight: 750; }
      .continue-meta span:first-child::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 12px var(--success); }
      .continue-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 56px;
        margin-top: 10px;
        padding: 0 17px 0 20px;
        border: 1px solid transparent;
        border-radius: 19px;
        background: var(--accent);
        color: #11141e;
        box-shadow: 0 15px 32px var(--accent-glow);
        cursor: pointer;
        font-size: 15px;
        font-weight: 800;
        transition: transform 180ms var(--ease), box-shadow 180ms var(--ease);
      }
      .continue-button span:last-child { font-size: 24px; font-weight: 500; line-height: 0; }
      .continue-button:hover { transform: translateY(-2px); box-shadow: 0 19px 38px var(--accent-glow); }
      .continue-button:active { transform: scale(0.97); }

      .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 14px; }
      .quick-action {
        min-height: 58px;
        border: 1px solid transparent;
        border-radius: 16px;
        background: transparent;
        color: rgba(244,246,255,0.57);
        cursor: pointer;
        font-size: 10px;
        line-height: 1.7;
        transition: transform 180ms var(--ease), background-color 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease);
      }
      .quick-action .quick-icon { display: block; color: rgba(244,246,255,0.86); font-size: 19px; line-height: 1.2; }
      .quick-action:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: white; }
      .quick-action:active { transform: scale(0.94); }
      .swipe-hint { margin-top: 12px; color: rgba(244,246,255,0.28); font-size: 10px; text-align: center; letter-spacing: 0.08em; }

      .sheet-backdrop { position: fixed; z-index: 20; inset: 0; display: none; background: rgba(3,5,9,0.54); backdrop-filter: blur(5px); }
      .sheet-backdrop.show { display: block; }
      .sheet {
        position: fixed;
        z-index: 21;
        right: 0;
        bottom: 0;
        left: 0;
        width: min(430px, 100vw);
        margin: 0 auto;
        padding: 10px 18px max(21px, env(safe-area-inset-bottom));
        border: 1px solid var(--line-strong);
        border-bottom: 0;
        border-radius: 28px 28px 0 0;
        background: var(--surface-solid);
        box-shadow: 0 -24px 70px rgba(0,0,0,0.36);
        transform: translateY(105%);
        transition: transform 300ms var(--ease);
      }
      .sheet.show { transform: translateY(0); }
      .sheet-handle { width: 36px; height: 4px; margin: 0 auto 18px; border-radius: 99px; background: var(--quiet); }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .sheet-head h2 { margin: 0; font-size: 21px; letter-spacing: -0.04em; }
      .sheet-head p { margin-top: 4px; color: var(--quiet); font-size: 11px; }
      .sheet-close { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 24px; }
      .sheet-list { display: grid; gap: 8px; margin-top: 21px; max-height: 48vh; overflow-y: auto; }
      .sheet-role {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 66px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }
      .sheet-role.active { border-color: var(--accent); background: var(--accent-soft); }
      .sheet-role-art { flex: 0 0 49px; width: 49px; height: 49px; border-radius: 14px; background: var(--role-gradient); }
      .sheet-role[data-role="mira"] .sheet-role-art { --role-gradient: linear-gradient(135deg, #b9c3ff, #334577); }
      .sheet-role[data-role="lume"] .sheet-role-art { --role-gradient: linear-gradient(135deg, #ffd4ab, #7c4153); }
      .sheet-role[data-role="riven"] .sheet-role-art { --role-gradient: linear-gradient(135deg, #9ce3d3, #27686b); }
      .sheet-role[data-role="null"] .sheet-role-art { --role-gradient: linear-gradient(135deg, #c4c8d7, #555c6c); }
      .sheet-role-copy strong { display: block; font-size: 14px; }
      .sheet-role-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
      .sheet-role-arrow { margin-left: auto; color: var(--quiet); font-size: 20px; }
      .mode-list { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 22px; }
      .mode-button { min-height: 70px; padding: 11px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); cursor: pointer; text-align: left; }
      .mode-button strong { display: block; font-size: 13px; }
      .mode-button span { display: block; margin-top: 6px; color: var(--quiet); font-size: 10px; }
      .mode-button.active { border-color: var(--accent); background: var(--accent-soft); }
      .more-list { display: grid; gap: 2px; margin-top: 17px; }
      .more-item { display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid var(--line); color: var(--text); cursor: pointer; font-size: 13px; }
      .more-item span { color: var(--quiet); font-size: 18px; }

      .toast { position: fixed; z-index: 40; right: 18px; bottom: max(19px, env(safe-area-inset-bottom)); left: 18px; width: min(394px, calc(100vw - 36px)); margin: auto; padding: 12px 15px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity 190ms var(--ease), transform 190ms var(--ease); font-size: 12px; text-align: center; }
      .toast.show { opacity: 1; transform: translateY(0); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body data-theme="night">
    <div class="mobile-preview" id="preview"></div>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="sheet" aria-live="polite"></div>
    <div class="toast" id="toast" role="status"></div>

    <script>
      const roles = {
        mira: { name: 'Mira', title: '夜航观测员', desc: '夜航列车 · 第 04 节', symbol: '◒' },
        lume: { name: 'Lume', title: '余烬里的信使', desc: '灰港 · 雨夜档案', symbol: '✧' },
        riven: { name: 'Riven', title: '潮汐协议', desc: '深海节点 · 12:47', symbol: '◇' },
        null: { name: 'Noct', title: '未命名世界', desc: '新体验等待建立', symbol: '○' },
      };

      let currentRole = 'mira';
      let theme = 'night';
      let sheetType = null;
      let touchStartY = 0;

      const preview = document.getElementById('preview');
      const sheet = document.getElementById('sheet');
      const sheetBackdrop = document.getElementById('sheetBackdrop');
      const toast = document.getElementById('toast');

      function roleSheet() {
        return `<div class="sheet-handle"></div><div class="sheet-head"><div><h2>角色台</h2><p>选择一个角色，进入它的世界</p></div><button class="sheet-close" data-action="close-sheet" type="button">×</button></div><div class="sheet-list">${Object.keys(roles).map(role => { const data = roles[role]; return `<button class="sheet-role ${role === currentRole ? 'active' : ''}" data-role="${role}" type="button"><span class="sheet-role-art"></span><span class="sheet-role-copy"><strong>${data.name}</strong><span>${data.title} · ${data.desc}</span></span><span class="sheet-role-arrow">›</span></button>`; }).join('')}</div>`;
      }

      function modeSheet() {
        return `<div class="sheet-handle"></div><div class="sheet-head"><div><h2>体验模式</h2><p>同一个角色世界，可以拥有不同玩法</p></div><button class="sheet-close" data-action="close-sheet" type="button">×</button></div><div class="mode-list"><button class="mode-button active" data-action="mode-chat" type="button"><strong>自由聊天</strong><span>角色互动 · 当前可用</span></button><button class="mode-button" data-action="mode-novel" type="button"><strong>互动小说</strong><span>分支叙事 · 预留</span></button><button class="mode-button" data-action="mode-galgame" type="button"><strong>Galgame</strong><span>立绘与选择 · 预留</span></button><button class="mode-button" data-action="mode-rpg" type="button"><strong>RPG</strong><span>状态与指令 · 预留</span></button></div>`;
      }

      function moreSheet() {
        return `<div class="sheet-handle"></div><div class="sheet-head"><div><h2>更多</h2><p>管理和创作属于体验的后台层</p></div><button class="sheet-close" data-action="close-sheet" type="button">×</button></div><div class="more-list"><button class="more-item" data-action="create" type="button">角色 / 世界书 / UI 创作 <span>›</span></button><button class="more-item" data-action="archive" type="button">体验档案与备份 <span>›</span></button><button class="more-item" data-action="theme" type="button">切换 Day / Night <span>◐</span></button></div>`;
      }

      function renderSheet(type) {
        sheetType = type;
        sheet.innerHTML = type === 'roles' ? roleSheet() : type === 'modes' ? modeSheet() : moreSheet();
        sheet.classList.add('show');
        sheetBackdrop.classList.add('show');
        bindSheetInteractions();
      }

      function closeSheet() {
        sheetType = null;
        sheet.classList.remove('show');
        sheetBackdrop.classList.remove('show');
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function setTheme(next) {
        theme = next;
        document.body.dataset.theme = theme;
        renderHome();
        if (sheetType) renderSheet(sheetType);
      }

      function homeMarkup() {
        const data = roles[currentRole];
        return `<div class="home" data-role="${currentRole}">
          <div class="grain"></div>
          <header class="mobile-header safe-top">
            <div class="session-chip"><span class="session-avatar">${data.symbol}</span><span>当前体验 · ${data.title}</span></div>
            <div class="header-actions"><button class="round-button" data-action="theme" type="button" aria-label="切换主题">${theme === 'night' ? '☼' : '☾'}</button><button class="round-button" data-action="more" type="button" aria-label="打开更多">☷</button></div>
          </header>
          <main>
            <div class="scene-area"><div class="scene-mark">${data.symbol}</div></div>
            <section class="identity"><div class="identity-kicker">CONTINUE EXPERIENCE</div><h1>${data.name}</h1><p>${data.title} · ${data.desc}</p></section>
          </main>
          <section class="bottom-console safe-bottom" id="bottomConsole">
            <div class="console-handle"></div>
            <div class="continue-meta"><span>上次体验 · 12 分钟前</span><span>已保存</span></div>
            <button class="continue-button" data-action="continue" type="button"><span>继续进入 ${data.name} 的世界</span><span>→</span></button>
            <div class="quick-actions"><button class="quick-action" data-action="roles" type="button"><span class="quick-icon">◎</span>角色台</button><button class="quick-action" data-action="modes" type="button"><span class="quick-icon">◈</span>模式</button><button class="quick-action" data-action="create" type="button"><span class="quick-icon">✦</span>创作</button><button class="quick-action" data-action="more" type="button"><span class="quick-icon">☷</span>更多</button></div>
            <div class="swipe-hint">上滑查看体验 · 点击角色台选角</div>
          </section>
        </div>`;
      }

      function renderHome() {
        preview.innerHTML = homeMarkup();
        bindHomeInteractions();
      }

      function bindHomeInteractions() {
        preview.querySelectorAll('[data-action]').forEach(element => element.addEventListener('click', () => {
          const action = element.dataset.action;
          if (action === 'roles') renderSheet('roles');
          else if (action === 'modes') renderSheet('modes');
          else if (action === 'more') renderSheet('more');
          else if (action === 'theme') setTheme(theme === 'night' ? 'day' : 'night');
          else if (action === 'continue') showToast(`正在进入 ${roles[currentRole].name} 的体验…`);
          else if (action === 'create') showToast('创作能力会在当前体验内按需呼出');
        }));

        const consoleElement = document.getElementById('bottomConsole');
        consoleElement.addEventListener('touchstart', event => { touchStartY = event.changedTouches[0].clientY; }, { passive: true });
        consoleElement.addEventListener('touchend', event => {
          const distance = touchStartY - event.changedTouches[0].clientY;
          if (distance > 42) renderSheet('roles');
        }, { passive: true });
      }

      function bindSheetInteractions() {
        sheet.querySelectorAll('[data-role]').forEach(element => element.addEventListener('click', () => {
          currentRole = element.dataset.role;
          closeSheet();
          renderHome();
          showToast(`已切换到 ${roles[currentRole].name}`);
        }));
        sheet.querySelectorAll('[data-action]').forEach(element => element.addEventListener('click', () => {
          const action = element.dataset.action;
          if (action === 'close-sheet') closeSheet();
          else if (action === 'theme') setTheme(theme === 'night' ? 'day' : 'night');
          else if (action === 'create') { closeSheet(); showToast('创作能力会在当前体验内按需呼出'); }
          else if (action === 'archive') { closeSheet(); showToast('体验档案和备份属于后台层'); }
          else if (action.startsWith('mode-')) { closeSheet(); showToast(`${action.slice(5)} 模式将在后续体验中展开`); }
        }));
      }

      sheetBackdrop.addEventListener('click', closeSheet);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeSheet(); });
      renderHome();
    </script>
  </body>
</html>
