<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LLM Project · Stage and Module Rail</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fbfbfa;
        --canvas-soft: #f2f7f7;
        --text: #20232b;
        --muted: #7a808b;
        --quiet: #a6abb3;
        --line: #d3d6d9;
        --route: #8d9299;
        --route-active: #5264d7;
        --brand: #5663bd;
        --role-card: #5d68c4;
        --role-card-dark: #4d59af;
        --role-text: #ffffff;
        --rail-bg: #dffbfa;
        --rail-line: #c3eeed;
        --module-1: #d6b97e;
        --module-2: #76a6ee;
        --module-3: #ef7f83;
        --module-4: #596568;
        --module-5: #a98bd7;
        --module-6: #61bba9;
        --module-text: #ffffff;
        --dot: #7fd8be;
        --surface: rgba(255,255,255,0.8);
        --shadow: 0 24px 70px rgba(48, 53, 68, 0.16);
        --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
      }

      [data-theme="night"] {
        color-scheme: dark;
        --canvas: #0b0f17;
        --canvas-soft: #111a25;
        --text: #f3f5fb;
        --muted: #a2aab8;
        --quiet: #697486;
        --line: rgba(210, 221, 255, 0.22);
        --route: rgba(206, 214, 232, 0.56);
        --route-active: #9ca9ff;
        --brand: #aeb8ff;
        --role-card: #5c6bd0;
        --role-card-dark: #3d4a9c;
        --role-text: #ffffff;
        --rail-bg: rgba(26, 69, 82, 0.78);
        --rail-line: rgba(130, 226, 218, 0.35);
        --module-1: #9b7d49;
        --module-2: #4e7fbd;
        --module-3: #b95d69;
        --module-4: #39484b;
        --module-5: #765e9d;
        --module-6: #3d897d;
        --module-text: #ffffff;
        --dot: #83e5c9;
        --surface: rgba(19, 25, 36, 0.78);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      }

      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; }
      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 0%, rgba(112, 131, 224, 0.12), transparent 34rem), var(--canvas);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
        transition: background-color 260ms var(--ease), color 260ms var(--ease);
      }
      button { font: inherit; }
      button:focus-visible { outline: 2px solid var(--route-active); outline-offset: 3px; }

      .device {
        position: relative;
        width: min(100vw, 430px);
        height: min(100svh, 900px);
        min-height: 680px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 38px;
        background: var(--canvas);
        box-shadow: var(--shadow);
      }
      @media (max-width: 520px) {
        body { display: block; }
        .device { width: 100vw; height: 100svh; min-height: 100svh; border: 0; border-radius: 0; box-shadow: none; }
      }

      .screen {
        position: relative;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 17% 65%, rgba(115, 192, 183, 0.08), transparent 13rem),
          linear-gradient(145deg, transparent 0 62%, var(--canvas-soft) 100%),
          var(--canvas);
        isolation: isolate;
      }
      .screen::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 0;
        opacity: 0.38;
        pointer-events: none;
        background-image: radial-gradient(var(--line) 0.6px, transparent 0.6px);
        background-size: 18px 18px;
        mask-image: linear-gradient(140deg, black, transparent 56%);
      }

      .brand {
        position: absolute;
        z-index: 5;
        top: max(18px, env(safe-area-inset-top));
        left: 22px;
        color: var(--brand);
        font-family: "Comic Sans MS", "Bradley Hand", cursive;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.04em;
        transform: rotate(-2deg);
      }
      .brand::after {
        content: "";
        display: block;
        width: 57px;
        height: 3px;
        margin: 3px 0 0 4px;
        border-radius: 99px;
        background: var(--brand);
        opacity: 0.28;
        transform: rotate(-3deg);
      }
      .top-actions {
        position: absolute;
        z-index: 6;
        top: max(16px, env(safe-area-inset-top));
        right: 18px;
        display: flex;
        gap: 7px;
      }
      .top-action {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
        transition: transform 180ms var(--ease), color 180ms var(--ease), background-color 180ms var(--ease);
      }
      .top-action:hover { color: var(--text); background: var(--canvas-soft); transform: translateY(-2px); }
      .top-action:active { transform: scale(0.92); }

      .role-panel {
        position: absolute;
        z-index: 4;
        top: 117px;
        left: 12px;
        width: 74%;
        height: 157px;
        padding: 24px 22px;
        overflow: hidden;
        clip-path: polygon(0 0, 94% 0, 100% 12%, 94% 100%, 2% 94%);
        background: linear-gradient(125deg, var(--role-card), var(--role-card-dark));
        color: var(--role-text);
        cursor: pointer;
        text-align: left;
        box-shadow: 10px 14px 0 rgba(46, 55, 143, 0.08), 0 18px 30px rgba(61, 72, 169, 0.18);
        transition: transform 240ms var(--ease), filter 240ms var(--ease), box-shadow 240ms var(--ease);
      }
      .role-panel::before {
        content: "";
        position: absolute;
        top: -48px;
        right: 32px;
        width: 160px;
        height: 160px;
        border: 1px solid rgba(255,255,255,0.13);
        border-radius: 50%;
      }
      .role-panel::after {
        content: "CURRENT EXPERIENCE";
        position: absolute;
        right: 33px;
        top: 27px;
        color: rgba(255,255,255,0.45);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.16em;
        writing-mode: vertical-rl;
      }
      .role-panel:hover { filter: brightness(1.06); transform: translate(2px, -2px); box-shadow: 13px 17px 0 rgba(46, 55, 143, 0.08), 0 23px 36px rgba(61, 72, 169, 0.22); }
      .role-panel:active { transform: scale(0.98); }
      .role-kicker { position: relative; z-index: 1; color: rgba(255,255,255,0.58); font-size: 9px; font-weight: 800; letter-spacing: 0.18em; }
      .role-name { position: relative; z-index: 1; margin-top: 9px; font-size: 30px; font-weight: 760; letter-spacing: -0.05em; }
      .role-context { position: relative; z-index: 1; margin-top: 4px; color: rgba(255,255,255,0.72); font-size: 11px; }
      .role-arrow {
        position: absolute;
        z-index: 2;
        right: 31px;
        bottom: 16px;
        display: grid;
        place-items: center;
        width: 61px;
        height: 34px;
        border: 5px solid rgba(255,255,255,0.86);
        border-radius: 12px 15px 9px 12px;
        background: rgba(255,255,255,0.92);
        color: #151923;
        font-size: 25px;
        line-height: 1;
        transform: rotate(-2deg);
      }

      .route {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .route-shadow { fill: none; stroke: var(--canvas); stroke-width: 6; opacity: 0.75; }
      .route-line { fill: none; stroke: var(--route); stroke-width: 1.4; }
      .route-dash { fill: none; stroke: var(--route-active); stroke-width: 1.5; stroke-dasharray: 9 10; opacity: 0.76; }
      .route-node { fill: var(--route-active); opacity: 0.9; }
      .route-node-ring { fill: none; stroke: var(--route-active); stroke-width: 1; opacity: 0.45; }

      .avatar-stage {
        position: absolute;
        z-index: 0;
        top: 315px;
        right: 45%;
        bottom: 18px;
        left: 18px;
        pointer-events: none;
      }
      .stage-orbit {
        position: absolute;
        left: 50%;
        bottom: 10%;
        width: 150px;
        height: 52px;
        border: 1px solid var(--line);
        border-radius: 50%;
        opacity: 0.36;
        transform: translateX(-50%) rotate(-12deg);
      }
      .stage-orbit::before, .stage-orbit::after { content: ""; position: absolute; border: 1px solid var(--line); border-radius: 50%; }
      .stage-orbit::before { inset: -16px 25px; transform: rotate(15deg); }
      .stage-orbit::after { inset: 12px -18px; transform: rotate(-26deg); }
      .stage-label {
        position: absolute;
        left: 50%;
        bottom: calc(10% - 24px);
        color: var(--quiet);
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.16em;
        opacity: 0.7;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .stage-light {
        position: absolute;
        left: 50%;
        bottom: 7%;
        width: 180px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(117, 199, 191, 0.12), transparent 68%);
        filter: blur(8px);
        transform: translateX(-50%);
      }

      .module-rail {
        position: absolute;
        z-index: 3;
        right: 10px;
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 45%;
        height: 46%;
        overflow: hidden;
        clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%, 0 8%);
        border: 1px solid var(--rail-line);
        background: var(--rail-bg);
        box-shadow: -10px 12px 0 rgba(98, 183, 183, 0.08), 0 18px 35px rgba(29, 96, 104, 0.1);
      }
      .rail-inner {
        height: 100%;
        padding: 23px 11px 15px 17px;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .rail-inner::-webkit-scrollbar { display: none; }
      .rail-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin: 0 5px 12px;
        color: rgba(37, 87, 90, 0.72);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.15em;
      }
      [data-theme="night"] .rail-heading { color: rgba(202, 250, 245, 0.7); }
      .rail-heading span:last-child { font-size: 13px; letter-spacing: 0; }
      .module-list { display: grid; gap: 11px; }
      .module-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 69px;
        padding: 10px 10px 10px 21px;
        overflow: hidden;
        clip-path: polygon(10% 0, 100% 0, 91% 100%, 0 100%);
        border: 0;
        color: var(--module-text);
        cursor: pointer;
        text-align: left;
        box-shadow: 3px 5px 0 rgba(25, 40, 48, 0.12);
        transition: transform 180ms var(--ease), filter 180ms var(--ease);
      }
      .module-card::before { content: ""; position: absolute; inset: 0; opacity: 0.15; background: linear-gradient(115deg, rgba(255,255,255,0.84), transparent 42%); pointer-events: none; }
      .module-card:hover { filter: brightness(1.08); transform: translateX(-3px); }
      .module-card:active { transform: scale(0.97); }
      .module-card:nth-child(1) { background: var(--module-1); }
      .module-card:nth-child(2) { background: var(--module-2); }
      .module-card:nth-child(3) { background: var(--module-3); }
      .module-card:nth-child(4) { background: var(--module-4); }
      .module-card:nth-child(5) { background: var(--module-5); }
      .module-card:nth-child(6) { background: var(--module-6); }
      .module-dot { position: relative; z-index: 1; flex: 0 0 14px; width: 14px; height: 14px; border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; background: var(--dot); box-shadow: 0 0 9px rgba(150,255,220,0.35); }
      .module-copy { position: relative; z-index: 1; min-width: 0; }
      .module-copy strong { display: block; overflow: hidden; font-size: 13px; font-weight: 760; text-overflow: ellipsis; white-space: nowrap; }
      .module-copy span { display: block; margin-top: 3px; color: rgba(255,255,255,0.7); font-size: 9px; }
      .module-arrow { position: relative; z-index: 1; margin-left: auto; padding-left: 3px; color: rgba(255,255,255,0.82); font-size: 18px; }
      .rail-fade { position: absolute; z-index: 2; right: 0; bottom: 0; left: 0; height: 26px; background: linear-gradient(transparent, var(--rail-bg)); pointer-events: none; }
      .rail-scroll-cue { position: absolute; z-index: 3; right: 8px; bottom: 8px; display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--rail-line); border-radius: 50%; background: var(--rail-bg); color: var(--route-active); font-size: 13px; pointer-events: none; }

      .sheet-backdrop { position: fixed; z-index: 20; inset: 0; display: none; background: rgba(3,5,9,0.5); backdrop-filter: blur(4px); }
      .sheet-backdrop.show { display: block; }
      .sheet {
        position: fixed;
        z-index: 21;
        right: 0;
        bottom: 0;
        left: 0;
        width: min(430px, 100vw);
        max-height: 76svh;
        margin: auto;
        padding: 11px 18px max(21px, env(safe-area-inset-bottom));
        overflow-y: auto;
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 28px 28px 0 0;
        background: var(--surface);
        box-shadow: 0 -24px 70px rgba(0,0,0,0.3);
        backdrop-filter: blur(20px);
        transform: translateY(105%);
        transition: transform 300ms var(--ease);
      }
      .sheet.show { transform: translateY(0); }
      .sheet-handle { width: 38px; height: 4px; margin: 0 auto 18px; border-radius: 99px; background: var(--quiet); }
      .sheet-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .sheet-heading h2 { margin: 0; font-size: 21px; letter-spacing: -0.04em; }
      .sheet-heading p { margin-top: 4px; color: var(--muted); font-size: 11px; }
      .sheet-close { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 25px; }
      .sheet-roles { display: grid; gap: 8px; margin-top: 20px; }
      .sheet-role { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 65px; padding: 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); cursor: pointer; text-align: left; }
      .sheet-role.active { border-color: var(--route-active); background: var(--canvas-soft); }
      .sheet-role-art { flex: 0 0 47px; width: 47px; height: 47px; border-radius: 13px; background: var(--role-gradient); }
      .sheet-role[data-role="mira"] .sheet-role-art { --role-gradient: linear-gradient(135deg, #b9c3ff, #334577); }
      .sheet-role[data-role="lume"] .sheet-role-art { --role-gradient: linear-gradient(135deg, #ffd4ab, #7c4153); }
      .sheet-role[data-role="riven"] .sheet-role-art { --role-gradient: linear-gradient(135deg, #9ce3d3, #27686b); }
      .sheet-role[data-role="null"] .sheet-role-art { --role-gradient: linear-gradient(135deg, #c4c8d7, #555c6c); }
      .sheet-role-copy strong { display: block; font-size: 14px; }
      .sheet-role-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
      .sheet-role-arrow { margin-left: auto; color: var(--quiet); font-size: 20px; }
      .toast { position: fixed; z-index: 40; right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); left: 18px; width: min(394px, calc(100vw - 36px)); margin: auto; padding: 12px 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 190ms var(--ease), transform 190ms var(--ease); font-size: 12px; text-align: center; backdrop-filter: blur(15px); }
      .toast.show { opacity: 1; transform: translateY(0); }

      @media (max-height: 750px) {
        .role-panel { top: 94px; height: 137px; padding-top: 20px; }
        .avatar-stage { top: 286px; }
        .module-rail { height: 43%; }
        .scene-area { bottom: 265px; }
        .identity { bottom: 225px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body data-theme="day">
    <div class="device" id="device"></div>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="sheet"></div>
    <div class="toast" id="toast" role="status"></div>

    <script>
      const roles = {
        mira: { name: 'Mira', title: '夜航观测员', context: '夜航列车 · 第 04 节', symbol: '◒' },
        lume: { name: 'Lume', title: '余烬里的信使', context: '灰港 · 雨夜档案', symbol: '✧' },
        riven: { name: 'Riven', title: '潮汐协议', context: '深海节点 · 12:47', symbol: '◇' },
        null: { name: 'Noct', title: '未命名世界', context: '新体验等待建立', symbol: '○' },
      };

      const modules = [
        { id: 'characters', name: '角色库', sub: '选择与管理角色', action: 'roles' },
        { id: 'worlds', name: '世界书库', sub: '世界、地点与设定', action: 'worlds' },
        { id: 'backgrounds', name: '背景图库', sub: '为体验选择背景', action: 'backgrounds' },
        { id: 'ui', name: 'UI 模组库', sub: '角色专属界面', action: 'ui' },
        { id: 'modes', name: '体验模式', sub: '聊天、RPG、互动小说', action: 'modes' },
        { id: 'archive', name: '体验档案', sub: '备份与恢复', action: 'archive' },
      ];

      let currentRole = 'mira';
      let theme = 'day';
      let sheetOpen = false;

      const device = document.getElementById('device');
      const sheet = document.getElementById('sheet');
      const sheetBackdrop = document.getElementById('sheetBackdrop');
      const toast = document.getElementById('toast');

      function moduleMarkup(item) {
        return `<button class="module-card" data-action="${item.action}" type="button"><span class="module-dot"></span><span class="module-copy"><strong>${item.name}</strong><span>${item.sub}</span></span><span class="module-arrow">›</span></button>`;
      }

      function screenMarkup() {
        const role = roles[currentRole];
        return `<div class="screen" data-role="${currentRole}">
          <div class="brand">LLM Project</div>
          <div class="top-actions"><button class="top-action" data-action="theme" type="button" aria-label="切换主题">${theme === 'day' ? '☾' : '☼'}</button><button class="top-action" data-action="more" type="button" aria-label="打开更多">···</button></div>
          <button class="role-panel" data-action="enter" type="button"><div class="role-kicker">CURRENT ROLE</div><div class="role-name">${role.name}</div><div class="role-context">${role.title} · ${role.context}</div><span class="role-arrow">→</span></button>
          <svg class="route" viewBox="0 0 430 900" preserveAspectRatio="none" aria-hidden="true"><path class="route-shadow" d="M 320 268 C 332 350, 308 440, 252 555"></path><path class="route-line" d="M 320 268 C 332 350, 308 440, 252 555"></path><path class="route-dash" d="M 326 268 C 338 350, 314 440, 258 555"></path><circle class="route-node-ring" cx="320" cy="268" r="7"></circle><circle class="route-node" cx="252" cy="555" r="3"></circle></svg>
          <div class="avatar-stage" aria-label="未来 Live2D / 3D 角色看板区域"><div class="stage-light"></div><div class="stage-orbit"></div><div class="stage-label">AVATAR STAGE · RESERVED</div></div>
          <section class="module-rail" aria-label="功能模块轨道"><div class="rail-inner"><div class="rail-heading"><span>MODULE RAIL</span><span>↕</span></div><div class="module-list">${modules.map(moduleMarkup).join('')}</div></div><div class="rail-fade"></div><div class="rail-scroll-cue">⌄</div></section>
        </div>`;
      }

      function roleSheetMarkup() {
        return `<div class="sheet-handle"></div><div class="sheet-heading"><div><h2>角色台</h2><p>选择角色，更新左侧看板和当前体验</p></div><button class="sheet-close" data-action="close" type="button">×</button></div><div class="sheet-roles">${Object.entries(roles).map(([id, role]) => `<button class="sheet-role ${id === currentRole ? 'active' : ''}" data-role="${id}" type="button"><span class="sheet-role-art"></span><span class="sheet-role-copy"><strong>${role.name}</strong><span>${role.title} · ${role.context}</span></span><span class="sheet-role-arrow">›</span></button>`).join('')}</div>`;
      }

      function openRoleSheet() {
        sheet.innerHTML = roleSheetMarkup();
        sheet.classList.add('show');
        sheetBackdrop.classList.add('show');
        sheetOpen = true;
        bindSheet();
      }

      function closeSheet() {
        sheet.classList.remove('show');
        sheetBackdrop.classList.remove('show');
        sheetOpen = false;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function toggleTheme() {
        theme = theme === 'day' ? 'night' : 'day';
        document.body.dataset.theme = theme;
        renderScreen();
      }

      function handleAction(action) {
        if (action === 'theme') toggleTheme();
        else if (action === 'more') showToast('更多设置将在右上角展开');
        else if (action === 'enter') showToast(`进入 ${roles[currentRole].name} 的体验`);
        else if (action === 'roles') openRoleSheet();
        else if (action === 'worlds') showToast('世界书库：保存世界、地点、组织与规则');
        else if (action === 'backgrounds') showToast('背景图库：选择当前体验的舞台氛围');
        else if (action === 'ui') showToast('UI 模组库：配置角色专属界面');
        else if (action === 'modes') showToast('体验模式：聊天、Galgame、RPG、互动小说');
        else if (action === 'archive') showToast('体验档案：备份与恢复');
      }

      function bindScreen() {
        device.querySelectorAll('[data-action]').forEach(element => element.addEventListener('click', () => handleAction(element.dataset.action)));
      }

      function bindSheet() {
        sheet.querySelectorAll('[data-role]').forEach(element => element.addEventListener('click', () => {
          currentRole = element.dataset.role;
          closeSheet();
          renderScreen();
          showToast(`已将 ${roles[currentRole].name} 放入当前角色卡`);
        }));
        sheet.querySelector('[data-action="close"]')?.addEventListener('click', closeSheet);
      }

      function renderScreen() {
        device.innerHTML = screenMarkup();
        bindScreen();
      }

      sheetBackdrop.addEventListener('click', closeSheet);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeSheet(); });
      renderScreen();
    </script>
  </body>
</html>
