<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LLM Project · Geometric Stage</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f8f9f7;
        --canvas-deep: #edf1f0;
        --text: #20232c;
        --muted: #737984;
        --quiet: #a4aab1;
        --line: rgba(39, 47, 63, 0.17);
        --line-soft: rgba(39, 47, 63, 0.09);
        --accent: #5b67c5;
        --accent-deep: #4653ae;
        --accent-soft: rgba(91, 103, 197, 0.12);
        --stage-color: #69bdb4;
        --surface: rgba(255, 255, 255, 0.74);
        --surface-solid: #ffffff;
        --module-text: #303542;
        --module-muted: #89909a;
        --shadow: 0 22px 65px rgba(49, 56, 70, 0.14);
        --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
        --module-a: #bf9b5b;
        --module-b: #5e8dda;
        --module-c: #d96e73;
        --module-d: #4b5a5d;
        --module-e: #8f75be;
        --module-f: #4b9b8e;
      }

      [data-theme="night"] {
        color-scheme: dark;
        --canvas: #0b1018;
        --canvas-deep: #101823;
        --text: #f2f4fa;
        --muted: #a5adba;
        --quiet: #687486;
        --line: rgba(214, 223, 255, 0.23);
        --line-soft: rgba(214, 223, 255, 0.11);
        --accent: #a4aeff;
        --accent-deep: #7e8af1;
        --accent-soft: rgba(164, 174, 255, 0.16);
        --stage-color: #79d4c7;
        --surface: rgba(22, 29, 40, 0.74);
        --surface-solid: #161d29;
        --module-text: #edf1fb;
        --module-muted: #98a2b2;
        --shadow: 0 25px 75px rgba(0, 0, 0, 0.4);
        --module-a: #b08b4b;
        --module-b: #5f8ed9;
        --module-c: #d26c76;
        --module-d: #5c6b6e;
        --module-e: #9475c7;
        --module-f: #4fafa0;
      }

      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; }
      body {
        display: grid;
        place-items: center;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 0%, rgba(104, 118, 215, 0.13), transparent 34rem), var(--canvas);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
        transition: background-color 260ms var(--ease), color 260ms var(--ease);
      }
      button { font: inherit; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

      .device {
        position: relative;
        width: min(100vw, 430px);
        height: min(100svh, 900px);
        min-height: 680px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 38px;
        background: var(--canvas);
        box-shadow: var(--shadow);
      }
      @media (max-width: 520px) {
        body { display: block; }
        .device { width: 100vw; height: 100svh; min-height: 100svh; border: 0; border-radius: 0; box-shadow: none; }
      }

      .screen {
        position: relative;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 4% 76%, rgba(105, 189, 180, 0.11), transparent 14rem),
          linear-gradient(145deg, transparent 0 60%, var(--canvas-deep) 100%),
          var(--canvas);
        isolation: isolate;
      }
      .screen::before {
        content: "";
        position: absolute;
        z-index: -3;
        top: 19%;
        right: -36%;
        width: 115%;
        height: 45%;
        border: 1px solid var(--line-soft);
        border-radius: 50%;
        transform: rotate(-57deg);
        box-shadow: 0 0 0 24px transparent, 0 0 0 25px var(--line-soft), 0 0 0 74px transparent, 0 0 0 75px var(--line-soft);
        opacity: 0.45;
        pointer-events: none;
      }
      .screen::after {
        content: "";
        position: absolute;
        z-index: -2;
        top: 50%;
        left: -20%;
        width: 150%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--line), transparent);
        transform: rotate(-57deg);
        opacity: 0.5;
        pointer-events: none;
      }

      .brand {
        position: absolute;
        z-index: 8;
        top: max(17px, env(safe-area-inset-top));
        left: 22px;
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 850;
        letter-spacing: 0.12em;
      }
      .brand-mark { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); box-shadow: 0 0 12px var(--accent); animation: brand-status-breathe 4.2s ease-in-out infinite; }
      @keyframes brand-status-breathe { 0%, 100% { opacity: 0.72; box-shadow: 0 0 5px var(--accent); } 50% { opacity: 1; box-shadow: 0 0 16px var(--accent), 0 0 25px var(--accent-soft); } }
      .top-actions { position: absolute; z-index: 8; top: max(14px, env(safe-area-inset-top)); right: 18px; display: flex; gap: 7px; }
      .top-action {
        display: grid;
        place-items: center;
        width: 35px;
        height: 35px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
        transition: transform 180ms var(--ease), color 180ms var(--ease), background-color 180ms var(--ease);
      }
      .top-action:hover { color: var(--text); background: var(--surface-solid); transform: translateY(-2px); }
      .top-action:active { transform: scale(0.92); }

      /* Entrance choreography: the home screen assembles from its stage geometry. */
      .screen:not(.ready) .brand,
      .screen:not(.ready) .top-actions,
        .screen:not(.ready) .role-panel,
        .screen:not(.ready) .avatar-stage,
      .screen:not(.ready) .module-rail {
        opacity: 0;
      }
      .screen:not(.ready) .brand,
      .screen:not(.ready) .top-actions { transform: translateY(-8px); }
      .screen:not(.ready) .role-panel { transform: translate(-24px, -8px); }
      .screen:not(.ready) .avatar-stage { transform: translateY(13px) scale(0.96); }
      .screen:not(.ready) .module-rail { transform: translateX(22px); }
      .screen.ready .brand,
      .screen.ready .top-actions,
      .screen.ready .role-panel,
      .screen.ready .avatar-stage,
      .screen.ready .module-rail {
        opacity: 1;
        transform: none;
        transition: opacity 360ms var(--ease), transform 520ms var(--ease);
      }
      .screen.ready .brand { transition-delay: 40ms; }
      .screen.ready .top-actions { transition-delay: 90ms; }
      .screen.ready .role-panel { transition-delay: 135ms; }
      .screen.ready .avatar-stage { transition-delay: 265ms; }
      .screen.ready .module-rail { transition-delay: 345ms; }
      .module-item { opacity: 0; transform: translateX(18px); }
      .screen.ready .module-item { opacity: 1; transform: none; transition: opacity 300ms var(--ease), transform 380ms var(--ease), border-color 180ms var(--ease), background-color 180ms var(--ease), box-shadow 180ms var(--ease); }
      .screen.ready .module-item:nth-child(1) { transition-delay: 390ms; }
      .screen.ready .module-item:nth-child(2) { transition-delay: 435ms; }
      .screen.ready .module-item:nth-child(3) { transition-delay: 480ms; }
      .screen.ready .module-item:nth-child(4) { transition-delay: 525ms; }
      .screen.ready .module-item:nth-child(5) { transition-delay: 570ms; }
      .screen.ready .module-item:nth-child(6) { transition-delay: 615ms; }
      .module-item.activating { transform: translateX(-4px) scale(0.965) !important; border-color: var(--module-accent); }

      .screen.experience-entering .role-panel { z-index: 10; transform: translate(14px, 90px) scale(1.12); filter: brightness(1.12); box-shadow: 0 0 0 999px var(--canvas), 0 0 80px var(--accent); transition: transform 520ms var(--ease), filter 360ms var(--ease), box-shadow 520ms var(--ease); }
      .screen.experience-entering .module-rail { opacity: 0.22; transform: translateX(16px); transition: opacity 300ms var(--ease), transform 420ms var(--ease); }
      .screen.experience-entering .avatar-stage { opacity: 0.12; transform: scale(1.08); transition: opacity 300ms var(--ease), transform 520ms var(--ease); }

      .stage-glow { animation: stage-breathe 6s ease-in-out infinite; }
      .stage-ring { animation: stage-orbit 9s ease-in-out infinite; }
      @keyframes stage-breathe { 0%, 100% { opacity: 0.62; transform: translateX(-50%) scale(0.96); } 50% { opacity: 1; transform: translateX(-50%) scale(1.05); } }
      @keyframes stage-orbit { 0%, 100% { transform: translateX(-50%) rotate(-13deg) scale(0.98); } 50% { transform: translateX(-50%) rotate(-7deg) scale(1.04); } }

      .edge-gesture-hint { position: absolute; z-index: 7; top: 43%; right: 0; display: grid; place-items: center; width: 15px; height: 72px; border-left: 1px solid var(--line); color: var(--quiet); opacity: 0.52; font-size: 12px; pointer-events: none; }
      .edge-gesture-hint::before { content: ""; position: absolute; top: 12px; bottom: 12px; left: -1px; border-left: 1px solid var(--accent); opacity: 0.7; animation: edge-pulse 3.8s ease-in-out infinite; }
      @keyframes edge-pulse { 0%, 70%, 100% { opacity: 0.12; transform: scaleY(0.45); } 84% { opacity: 0.85; transform: scaleY(1); } }

      /* The role surface is deliberately geometric, not a literal wireframe box. */
      .role-panel {
        position: absolute;
        z-index: 5;
        top: 119px;
        left: 12px;
        width: 76%;
        height: 166px;
        padding: 25px 24px;
        overflow: hidden;
        clip-path: polygon(0 0, 94% 0, 100% 12%, 92% 100%, 2% 94%);
        border: 0;
        background:
          linear-gradient(112deg, rgba(44, 52, 132, 0.88), rgba(42, 48, 112, 0.3) 58%, rgba(12, 15, 27, 0.5)),
          linear-gradient(128deg, var(--accent), var(--accent-deep));
        background-position: center;
        background-size: cover;
        color: white;
        cursor: default;
        text-align: left;
        box-shadow: 12px 17px 0 rgba(64, 78, 178, 0.08), 0 19px 35px rgba(67, 79, 170, 0.18);
        transition: transform 230ms var(--ease), filter 230ms var(--ease), box-shadow 230ms var(--ease);
      }
      .role-cover {
        position: absolute;
        z-index: 0;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(112deg, rgba(44, 52, 132, 0.86), rgba(42, 48, 112, 0.3) 58%, rgba(12, 15, 27, 0.52));
        background-position: center;
        background-size: cover;
        animation: role-cover-breathe 16s ease-in-out infinite;
        transform-origin: 58% 50%;
      }
      .screen[data-role="mira"] .role-cover {
        background-image:
          linear-gradient(112deg, rgba(44, 52, 132, 0.82), rgba(42, 48, 112, 0.27) 58%, rgba(12, 15, 27, 0.5)),
          url("./assets/mira-cover.png");
        background-position: center 24%;
        background-size: cover;
      }
      .screen[data-role="lume"] .role-cover { background-image: linear-gradient(112deg, rgba(92, 43, 61, 0.84), rgba(93, 54, 73, 0.24) 58%, rgba(21, 12, 22, 0.55)); }
      .screen[data-role="riven"] .role-cover { background-image: linear-gradient(112deg, rgba(17, 87, 91, 0.84), rgba(26, 115, 108, 0.24) 58%, rgba(7, 22, 25, 0.55)); }
      @keyframes role-cover-breathe {
        0%, 100% { opacity: 0.91; transform: scale(1.015) translate3d(0, 0, 0); }
        50% { opacity: 1; transform: scale(1.04) translate3d(-1.5%, -0.6%, 0); }
      }
      .role-cover-hit {
        position: absolute;
        z-index: 1;
        inset: 0 72px 0 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .role-kicker,
      .role-name,
      .role-context { pointer-events: none; }
      .role-enter {
        border: 0;
        padding: 0;
        cursor: pointer;
        transition: transform 160ms var(--ease), filter 160ms var(--ease);
      }
      .role-enter:hover { filter: brightness(0.95); transform: scale(1.06); }
      .role-enter:active { transform: scale(0.92); }
      .role-panel::before {
        content: "";
        position: absolute;
        top: -64px;
        right: 21px;
        width: 172px;
        height: 172px;
        border: 1px solid rgba(255,255,255,0.17);
        border-radius: 50%;
        box-shadow: 0 0 0 18px rgba(255,255,255,0.035), 0 0 0 42px rgba(255,255,255,0.025);
      }
      .role-panel::after {
        content: "01";
        position: absolute;
        right: 32px;
        top: 27px;
        color: rgba(255,255,255,0.5);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.16em;
      }
      .role-panel:hover { filter: brightness(1.06); transform: translate(2px, -2px); box-shadow: 15px 20px 0 rgba(64, 78, 178, 0.08), 0 25px 42px rgba(67, 79, 170, 0.23); }
      .role-panel:active { transform: scale(0.98); }
      .role-kicker { position: absolute; z-index: 1; top: 25px; left: 24px; color: rgba(255,255,255,0.62); font-size: 9px; font-weight: 850; letter-spacing: 0.18em; }
      .role-name { position: absolute; z-index: 1; top: 42px; left: 24px; font-size: 34px; font-weight: 780; letter-spacing: -0.06em; }
      .role-context { position: absolute; z-index: 1; right: 93px; bottom: 20px; left: 24px; overflow: hidden; color: rgba(255,255,255,0.8); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .role-enter {
        position: absolute;
        z-index: 2;
        right: 29px;
        bottom: 17px;
        display: grid;
        place-items: center;
        width: 49px;
        height: 38px;
        clip-path: polygon(13% 0, 100% 10%, 88% 100%, 0 88%);
        background: white;
        color: #1c2230;
        font-size: 23px;
        line-height: 1;
      }

      .avatar-stage {
        position: absolute;
        z-index: 1;
        top: 320px;
        right: 45%;
        bottom: 16px;
        left: 13px;
        pointer-events: none;
      }
      .stage-glow { position: absolute; left: 50%; bottom: 13%; width: 205px; height: 140px; border-radius: 50%; background: radial-gradient(ellipse, rgba(105, 189, 180, 0.16), transparent 68%); filter: blur(11px); transform: translateX(-50%); }
      .stage-ring { position: absolute; left: 50%; bottom: 11%; width: 158px; height: 55px; border: 1px solid rgba(105, 189, 180, 0.42); border-radius: 50%; transform: translateX(-50%) rotate(-13deg); }
      .stage-ring::before, .stage-ring::after { content: ""; position: absolute; border: 1px solid rgba(105, 189, 180, 0.19); border-radius: 50%; }
      .stage-ring::before { inset: -16px 22px; transform: rotate(22deg); }
      .stage-ring::after { inset: 13px -21px; transform: rotate(-28deg); }
      .stage-caption { position: absolute; left: 50%; bottom: 7%; color: var(--quiet); font-size: 8px; font-weight: 800; letter-spacing: 0.18em; opacity: 0.72; transform: translateX(-50%); white-space: nowrap; }

      .module-rail {
        position: absolute;
        z-index: 6;
        right: 12px;
        bottom: max(22px, env(safe-area-inset-bottom));
        width: 45%;
        height: 48%;
        overflow: hidden;
        padding: 4px 0 4px 4px;
      }
      .rail-head { display: flex; align-items: center; justify-content: space-between; margin: 0 8px 10px 12px; color: var(--muted); font-size: 9px; font-weight: 850; letter-spacing: 0.15em; }
      .rail-head .rail-count { color: var(--quiet); font-size: 11px; letter-spacing: 0; }
      .module-list { display: grid; gap: 7px; height: calc(100% - 27px); padding: 2px 4px 14px 0; overflow-y: auto; scrollbar-width: none; }
      .module-list::-webkit-scrollbar { display: none; }
      .module-item {
        position: relative;
        display: grid;
        grid-template-rows: auto minmax(22px, 1fr);
        gap: 5px;
        min-height: 84px;
        padding: 9px 7px 8px 9px;
        border: 1px solid var(--line-soft);
        border-radius: 13px 6px 13px 6px;
        background: var(--surface);
        color: var(--module-text);
        cursor: pointer;
        text-align: left;
        box-shadow: 5px 6px 0 rgba(48, 60, 84, 0.05);
        transition: transform 180ms var(--ease), border-color 180ms var(--ease), background-color 180ms var(--ease), box-shadow 180ms var(--ease);
      }
      .module-item::after { content: ""; position: absolute; right: 9px; bottom: 0; left: 12px; height: 1px; background: var(--module-accent); opacity: 0.6; }
      .module-item:hover { border-color: var(--module-accent); background: var(--surface-solid); box-shadow: 7px 9px 0 rgba(48, 60, 84, 0.07); transform: translateX(-3px); }
      .module-item:active { transform: scale(0.97); }
      .module-item:nth-child(1) { --module-accent: var(--module-a); }
      .module-item:nth-child(2) { --module-accent: var(--module-b); }
      .module-item:nth-child(3) { --module-accent: var(--module-c); }
      .module-item:nth-child(4) { --module-accent: var(--module-d); }
      .module-head { display: grid; grid-template-columns: 30px minmax(0, 1fr) 17px; align-items: center; gap: 7px; min-width: 0; }
      .module-symbol { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--module-accent); border-radius: 9px 4px 9px 4px; background: color-mix(in srgb, var(--module-accent) 15%, transparent); color: var(--module-accent); font-size: 14px; }
      .module-copy { min-width: 0; }
      .module-copy strong { display: block; overflow: hidden; color: var(--module-text); font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .module-preview { display: flex; align-items: center; gap: 5px; min-width: 0; margin: 1px 8px 0 3px; overflow: hidden; color: var(--module-muted); font-size: 9px; white-space: nowrap; }
      .module-arrow { color: var(--module-accent); font-size: 18px; }
      .preview-text { overflow: hidden; text-overflow: ellipsis; }
      .preview-person { position: relative; flex: 0 0 15px; width: 15px; height: 15px; color: var(--module-accent); opacity: 0.86; }
      .preview-person::before { content: ""; position: absolute; top: 0; left: 5px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
      .preview-person::after { content: ""; position: absolute; right: 1px; bottom: 0; left: 1px; height: 8px; border-radius: 7px 7px 3px 3px; background: currentColor; }
      .preview-image { position: relative; flex: 0 0 17px; width: 17px; height: 14px; border: 1.5px solid var(--module-accent); border-radius: 3px; opacity: 0.86; }
      .preview-image::before { content: ""; position: absolute; top: 2px; right: 2px; width: 3px; height: 3px; border-radius: 50%; background: var(--module-accent); }
      .preview-image::after { content: ""; position: absolute; right: 2px; bottom: 2px; left: 2px; height: 5px; background: var(--module-accent); clip-path: polygon(0 100%, 35% 28%, 58% 72%, 76% 44%, 100% 100%); }
      .preview-line { display: block; flex: 0 0 20px; height: 4px; border-radius: 99px; background: var(--module-accent); opacity: 0.52; }
      .preview-line.wide { flex-basis: 31px; }
      .preview-chip { padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; color: var(--module-muted); font-size: 7px; font-weight: 800; letter-spacing: 0.06em; }
      .rail-scroll-hint { position: absolute; right: 1px; bottom: 1px; display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 50%; background: var(--canvas); color: var(--muted); font-size: 12px; pointer-events: none; }

      .settings-backdrop { position: fixed; z-index: 20; inset: 0; display: none; background: rgba(3,5,9,0.42); backdrop-filter: blur(4px); }
      .settings-backdrop.show { display: block; }
      .settings-drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(350px, 88vw); padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom)); border-left: 1px solid var(--line); background: var(--surface-solid); box-shadow: -24px 0 70px rgba(0,0,0,0.24); transform: translateX(105%); transition: transform 300ms var(--ease); }
      .settings-drawer.show { transform: translateX(0); }
      .settings-drawer .drawer-handle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
      .settings-drawer .drawer-kicker { color: var(--muted); font-size: 9px; font-weight: 850; letter-spacing: 0.17em; }
      .settings-drawer h2 { margin: 7px 0 0; color: var(--text); font-size: 23px; letter-spacing: -0.05em; }
      .settings-close { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 22px; }
      .settings-drawer p { margin: 18px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
      .settings-list { display: grid; gap: 0; margin-top: 25px; }
      .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 58px; border-bottom: 1px solid var(--line); color: var(--text); font-size: 13px; }
      .settings-row span:last-child { color: var(--quiet); font-size: 18px; }
      .settings-theme { color: var(--accent) !important; cursor: pointer; }

      .role-picker-backdrop { position: fixed; z-index: 22; display: none; height: 196px; background: radial-gradient(ellipse at center, rgba(5, 8, 15, 0.2) 0%, rgba(5, 8, 15, 0.11) 62%, transparent 100%); backdrop-filter: blur(2px); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 13%, black 84%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0%, black 13%, black 84%, transparent 100%); }
      .role-picker-backdrop.show { display: block; animation: picker-backdrop-in 260ms var(--ease) both; }
      @keyframes picker-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
      .role-picker { position: fixed; z-index: 23; width: 430px; height: 166px; overflow: visible; color: white; opacity: 0; pointer-events: none; transform: translateY(8px) scale(0.96); transform-origin: 12px 0; transition: opacity 150ms var(--ease), transform 330ms var(--ease); }
      .role-picker.show { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
      .picker-deck { position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; overflow-x: auto; overflow-y: visible; scroll-snap-type: x proximity; scrollbar-width: none; }
      .picker-deck::-webkit-scrollbar { display: none; }
      .picker-card { position: relative; flex: 0 0 var(--role-card-small-width, 228px); height: 116px; overflow: hidden; clip-path: polygon(0 0, 94% 0, 100% 12%, 92% 100%, 2% 94%); border: 0; background: linear-gradient(145deg, #424fb4, #8791e2); color: white; cursor: pointer; scroll-snap-align: start; text-align: left; opacity: 0.5; transform: translateY(0) scale(0.96); filter: saturate(0.7); transition: flex-basis 330ms var(--ease), height 330ms var(--ease), transform 300ms var(--ease), opacity 250ms var(--ease), filter 250ms var(--ease), box-shadow 250ms var(--ease); }
      .picker-card::before { content: ""; position: absolute; z-index: 1; inset: 0; background: linear-gradient(112deg, rgba(255,255,255,0.1), transparent 48%, rgba(4,7,14,0.35)); pointer-events: none; }
      .picker-card[data-role="mira"] { background: linear-gradient(112deg, rgba(44,52,132,0.86), rgba(42,48,112,0.55)); }
      .picker-card[data-role="lume"] { background: linear-gradient(145deg, #613244, #c18072); }
      .picker-card[data-role="riven"] { background: linear-gradient(145deg, #15444a, #3d9489); }
      .picker-card[data-role="null"] { background: linear-gradient(145deg, #414b5c, #8992a1); }
      .picker-card .role-cover { z-index: 0; animation: none; }
      .picker-card[data-role="mira"] .role-cover { background-image: linear-gradient(112deg, rgba(44,52,132,0.58), rgba(18,22,58,0.5)), url("./assets/mira-cover.png"); background-position: center 24%; background-size: cover; }
      .picker-card.active { flex-basis: var(--role-card-width, 327px); height: 166px; opacity: 1; transform: translateY(0) scale(1); filter: saturate(1); box-shadow: 0 0 0 1px rgba(255,255,255,0.5), 0 16px 30px rgba(0,0,0,0.2); }
      .picker-card:hover { opacity: 0.94; filter: saturate(1); }
      .picker-card .role-kicker, .picker-card .role-name, .picker-card .role-context { z-index: 2; }
      .toast { position: fixed; z-index: 40; right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); left: 18px; width: min(394px, calc(100vw - 36px)); margin: auto; padding: 12px 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 190ms var(--ease), transform 190ms var(--ease); font-size: 12px; text-align: center; }
      .toast.show { opacity: 1; transform: translateY(0); }

      @media (max-height: 750px) {
        .role-panel { top: 93px; height: 150px; }
        .avatar-stage { top: 296px; }
        .module-rail { height: 44%; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body data-theme="day">
    <div class="device" id="device"></div>
    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <aside class="settings-drawer" id="settingsDrawer" aria-label="设置面板">
      <div class="drawer-handle"><div><div class="drawer-kicker">BACKSTAGE</div><h2>设置</h2></div><button class="settings-close" id="settingsClose" type="button" aria-label="关闭设置">×</button></div>
      <p>从右侧边缘侧滑打开这里。设置属于体验的后台层，不占据角色舞台。</p>
      <div class="settings-list"><div class="settings-row"><span>界面主题</span><span class="settings-theme" id="settingsTheme" role="button" tabindex="0">Day / Night</span></div><div class="settings-row"><span>API 配置</span><span>›</span></div><div class="settings-row"><span>用户设定</span><span>›</span></div><div class="settings-row"><span>Prompt 策略</span><span>›</span></div></div>
    </aside>
    <div class="role-picker-backdrop" id="rolePickerBackdrop"></div>
    <section class="role-picker" id="rolePicker" aria-label="最近聊过的角色"></section>
    <div class="toast" id="toast" role="status"></div>

    <script>
      const roles = {
        mira: { name: 'Mira', title: '夜航观测员', context: '夜航列车 · 第 04 节', recentLabel: '2 小时前', symbol: '◒' },
        lume: { name: 'Lume', title: '余烬里的信使', context: '灰港 · 雨夜档案', recentLabel: '昨天', symbol: '✧' },
        riven: { name: 'Riven', title: '潮汐协议', context: '深海节点 · 12:47', recentLabel: '3 天前', symbol: '◇' },
        null: { name: 'Noct', title: '未命名世界', context: '新体验等待建立', recentLabel: '更早', symbol: '○' },
      };
      const modules = [
        { name: '角色库', symbol: '♟', action: 'roles', preview: '<span class="preview-person"></span><span class="preview-person"></span><span class="preview-person"></span><span class="preview-text">3 个角色</span>' },
        { name: '世界书库', symbol: '◇', action: 'worlds', preview: '<span class="preview-line wide"></span><span class="preview-line"></span><span class="preview-text">3 种世界书</span>' },
        { name: '背景图库', symbol: '▧', action: 'backgrounds', preview: '<span class="preview-image"></span><span class="preview-image"></span><span class="preview-image"></span><span class="preview-text">6 个背景</span>' },
        { name: 'UI 模组库', symbol: '✦', action: 'ui', preview: '<span class="preview-chip">SCENE</span><span class="preview-chip">OPENING</span><span class="preview-text">4 个模组</span>' },
      ];

      let currentRole = 'mira';
      let pickerSelection = null;
      let theme = 'day';
      let edgeStartX = null;
      const device = document.getElementById('device');
      const toast = document.getElementById('toast');
      const settingsDrawer = document.getElementById('settingsDrawer');
      const settingsBackdrop = document.getElementById('settingsBackdrop');
      const settingsClose = document.getElementById('settingsClose');
      const settingsTheme = document.getElementById('settingsTheme');
      const rolePicker = document.getElementById('rolePicker');
      const rolePickerBackdrop = document.getElementById('rolePickerBackdrop');

      function moduleMarkup(item) {
        return `<button class="module-item" data-action="${item.action}" type="button"><span class="module-head"><span class="module-symbol">${item.symbol}</span><span class="module-copy"><strong>${item.name}</strong></span><span class="module-arrow">›</span></span><span class="module-preview">${item.preview}</span></button>`;
      }

      function screenMarkup() {
        const role = roles[currentRole];
        return `<div class="screen" data-role="${currentRole}"><div class="brand"><span class="brand-mark"></span>LLM PROJECT</div><div class="top-actions"><button class="top-action" data-action="theme" type="button" aria-label="切换主题">${theme === 'day' ? '☾' : '☼'}</button></div><span class="edge-gesture-hint" aria-hidden="true">‹</span><div class="role-panel"><button class="role-cover-hit" data-action="recent-roles" type="button" aria-label="查看最近聊过的角色"></button><span class="role-cover"></span><span class="role-kicker">CURRENT ROLE</span><span class="role-name">${role.name}</span><span class="role-context">${role.title} · ${role.context}</span><button class="role-enter" data-action="enter" type="button" aria-label="进入当前角色聊天">→</button></div><div class="avatar-stage" aria-label="未来 Live2D / 3D 角色看板区域"><div class="stage-glow"></div><div class="stage-ring"></div><div class="stage-caption">AVATAR STAGE · RESERVED</div></div><section class="module-rail" aria-label="功能模块轨道"><div class="rail-head"><span>MODULES</span><span class="rail-count">${modules.length.toString().padStart(2, '0')}</span></div><div class="module-list">${modules.map(moduleMarkup).join('')}</div><div class="rail-scroll-hint">⌄</div></section></div>`;
      }

      function pickerRoleMarkup(id, role) {
        const active = id === pickerSelection ? ' active' : '';
        return `<div class="picker-card${active}" data-role="${id}" role="button" tabindex="0"><span class="role-cover"></span><span class="role-kicker">${role.recentLabel}</span><span class="role-name">${role.name}</span><span class="role-context">${role.title} · ${role.context}</span></div>`;
      }

      function positionRolePicker() {
        const rect = device.getBoundingClientRect();
        const left = rect.left + device.clientLeft;
        const top = rect.top + device.clientTop;
        const width = device.clientWidth;
        rolePicker.style.top = `${top + 119}px`;
        rolePicker.style.left = `${left}px`;
        rolePicker.style.width = `${width}px`;
        rolePicker.style.setProperty('--role-card-width', `${width * 0.76}px`);
        rolePicker.style.setProperty('--role-card-small-width', `${width * 0.53}px`);
        rolePickerBackdrop.style.top = `${top + 104}px`;
        rolePickerBackdrop.style.left = `${left}px`;
        rolePickerBackdrop.style.width = `${width}px`;
      }

      function openRolePicker() {
        pickerSelection ??= currentRole;
        positionRolePicker();
        const recentOrder = ['mira', 'lume', 'riven', 'null'];
        // 初次打开时左侧仍是最新角色；选中旧角色后，它会吸附到原始角色卡位置。
        const orderedIds = [pickerSelection, ...recentOrder.filter(id => id !== pickerSelection)];
        const ordered = orderedIds.map(id => [id, roles[id]]);
        rolePicker.innerHTML = `<div class="picker-deck">${ordered.map(([id, role]) => pickerRoleMarkup(id, role)).join('')}</div>`;
        rolePicker.dataset.role = pickerSelection;
        rolePicker.classList.add('show');
        rolePickerBackdrop.classList.add('show');
        rolePicker.querySelectorAll('[data-role]').forEach(element => element.addEventListener('click', () => {
          const id = element.dataset.role;
          if (id === pickerSelection) {
            currentRole = pickerSelection;
            pickerSelection = null;
            closeRolePicker();
            renderScreen();
            showToast(`已将 ${roles[currentRole].name} 换到主页`);
            return;
          }
          pickerSelection = id;
          openRolePicker();
          showToast(`已聚焦 ${roles[pickerSelection].name}，再次点击以换上主页`);
        }));
      }

      function closeRolePicker() {
        pickerSelection = null;
        rolePicker.classList.remove('show');
        rolePickerBackdrop.classList.remove('show');
      }

      function renderScreen() {
        device.innerHTML = screenMarkup();
        const screen = device.querySelector('.screen');
        requestAnimationFrame(() => requestAnimationFrame(() => screen.classList.add('ready')));
        device.querySelectorAll('[data-action]').forEach(element => element.addEventListener('click', () => {
          const action = element.dataset.action;
          if (element.classList.contains('module-item')) {
            element.classList.add('activating');
            window.setTimeout(() => handleAction(action), 130);
          } else {
            handleAction(action);
          }
        }));
      }

      function showToast(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200); }
      function openSettings() { settingsDrawer.classList.add('show'); settingsBackdrop.classList.add('show'); }
      function closeSettings() { settingsDrawer.classList.remove('show'); settingsBackdrop.classList.remove('show'); }
      function toggleTheme() { theme = theme === 'day' ? 'night' : 'day'; document.body.dataset.theme = theme; renderScreen(); }
      function handleAction(action) {
        if (action === 'theme') toggleTheme();
        else if (action === 'recent-roles') openRolePicker();
        else if (action === 'enter') {
          const screen = device.querySelector('.screen');
          screen.classList.add('experience-entering');
          window.setTimeout(() => {
            screen.classList.remove('experience-entering');
            showToast(`进入 ${roles[currentRole].name} 的体验`);
          }, 520);
        } else if (action === 'roles') showToast('打开角色库页面');
        else if (action === 'worlds') showToast('世界书库：保存世界、地点、组织与规则');
        else if (action === 'backgrounds') showToast('背景图库：选择当前体验的舞台氛围');
        else if (action === 'ui') showToast('UI 模组库：配置角色专属界面');
      }

      device.addEventListener('pointerdown', event => {
        const rect = device.getBoundingClientRect();
        if (event.clientX - rect.left > rect.width - 34) {
          edgeStartX = event.clientX;
          device.setPointerCapture?.(event.pointerId);
        }
      });
      device.addEventListener('pointerup', event => {
        if (edgeStartX == null) return;
        const distance = edgeStartX - event.clientX;
        edgeStartX = null;
        if (distance > 42) openSettings();
      });
      device.addEventListener('pointercancel', () => { edgeStartX = null; });
      settingsClose.addEventListener('click', closeSettings);
      settingsBackdrop.addEventListener('click', closeSettings);
      rolePickerBackdrop.addEventListener('click', closeRolePicker);
      settingsTheme.addEventListener('click', toggleTheme);
      settingsTheme.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') toggleTheme(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeSettings(); closeRolePicker(); } });

      renderScreen();
    </script>
  </body>
</html>
